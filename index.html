<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>LT Space</title>

    <!-- Fonts: Encode Sans (UI) + Merriweather (chat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LT Space" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Theme Color. Matches the light background ThemeContext writes back
         (#f6f4ef); the anti-FOUC script below overwrites it when dark. -->
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="msapplication-TileColor" content="#f6f4ef" />

    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!--
      Paint the right theme before the bundle runs.

      ThemeContext applies the `dark` class from a React effect, which is one
      frame too late: every cold load flashed the light theme first. This reads
      the same localStorage mirror it does (`user-preferences`, see
      src/shared/userSettings.ts) and applies the class up front.

      Kept deliberately dependency-free and wrapped in try/catch — it runs
      before anything else, so a throw here would leave a blank page. If the
      mirror is missing or corrupt, falling through to the OS preference is the
      same default ThemeContext would pick anyway.
    -->
    <script>
      (function () {
        try {
          var stored = null;
          var mirror = localStorage.getItem('user-preferences');
          if (mirror) {
            var parsed = JSON.parse(mirror);
            if (parsed && typeof parsed.theme === 'string') stored = parsed.theme;
          }
          var isDark = stored === 'dark'
            || ((stored === 'system' || !stored)
              && window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#141414');
          }
        } catch (error) {
          /* No stored theme worth trusting; React will settle it on mount. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!--
      Service worker registration, and the escape hatch for when it goes wrong.

      A stale worker is not hypothetical here: an installed iOS web app keeps
      its own storage, never navigates to the network on its own, and can go on
      serving a cached index.html that asks for a bundle a later build already
      deleted. The import 404s, React never mounts, and the result is a blank
      screen with nothing on it to act on.

      Two guards, in order:
        1. `updateViaCache: 'none'` plus an explicit `update()` on every load,
           so sw.js itself is never served from the HTTP cache and an old worker
           cannot perpetuate itself.
        2. Recovery that reloads ONLY on a real asset error. The first version
           of this reloaded on a timer, which is worse than the disease: the
           main bundle is ~3 MB and takes seconds to even execute on a phone,
           so a timed reload aborts a download that was going to succeed and
           loops forever. A slow load is not a broken load, and only a failed
           request proves the difference. The timer that remains never reloads
           — past the deadline it just explains itself, and only once the
           network has been quiet, so a bundle still arriving is left alone.
    -->
    <script>
      (function () {
        var FLAG = 'sw-blank-recovery';
        var DEADLINE_MS = 45000;
        var QUIET_MS = 8000;
        var assetFailed = false;

        function root() { return document.getElementById('root'); }
        function mounted() { var el = root(); return !!el && el.childElementCount > 0; }

        function flag(value) {
          try {
            if (value === null) { sessionStorage.removeItem(FLAG); return null; }
            if (value !== undefined) { sessionStorage.setItem(FLAG, value); return value; }
            return sessionStorage.getItem(FLAG);
          } catch (error) { return null; } /* private mode: nothing to read or keep */
        }

        function wipeAndReload() {
          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) { return caches.delete(name); }));
            }).catch(function () {}));
          }
          // Reload either way: a cleanup that failed still leaves a reload as
          // the best available move, and hanging here would keep the blank page.
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        }

        function explain(detail) {
          var el = root();
          if (!el || el.childElementCount > 0) return;
          el.innerHTML =
            '<div style="font-family:system-ui,-apple-system,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1.5rem;line-height:1.6">' +
            '<h1 style="font-size:1.25rem;margin:0 0 .5rem">La app no terminó de cargar</h1>' +
            '<p style="margin:0 0 1rem;opacity:.75">' + detail + '</p>' +
            '<p><a href="/diag.html" style="color:#2563eb">Abrir el diagnóstico</a>' +
            ' · <a href="/clear-cache.html" style="color:#2563eb">Limpiar caché</a></p>' +
            '</div>';
        }

        // A script or stylesheet that failed outright is the one signal worth
        // acting on: that is the stale-bundle case, and a clean reload fixes it.
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || !el.tagName) return;
          var url = el.src || el.href || '';
          if (url.indexOf('/assets/') === -1) return;
          assetFailed = true;
          if (flag()) { explain('Un archivo de la app no se pudo cargar y limpiar la caché no alcanzó.'); return; }
          flag(String(Date.now()));
          wipeAndReload();
        }, true);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
              .then(function (registration) { registration.update(); })
              .catch(function (registrationError) {
                console.log('SW registration failed: ', registrationError);
              });
          });
        }

        function lastNetworkActivity() {
          if (!window.performance || !performance.getEntriesByType) return 0;
          var entries = performance.getEntriesByType('resource');
          var last = 0;
          for (var i = 0; i < entries.length; i++) {
            var end = entries[i].responseEnd || entries[i].startTime;
            if (end > last) last = end;
          }
          return last;
        }

        function check() {
          if (mounted()) { flag(null); return; }
          if (assetFailed) return; /* the error handler owns this case */
          var quiet = performance.now() - lastNetworkActivity();
          if (quiet < QUIET_MS) { setTimeout(check, 5000); return; } /* still arriving */
          explain('Los archivos terminaron de bajar pero la interfaz no montó. El diagnóstico dice cuál falló.');
        }

        setTimeout(check, DEADLINE_MS);
      })();
    </script>
  </body>
</html>
