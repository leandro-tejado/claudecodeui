<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>LT Space</title>

    <!-- Fonts: Encode Sans (UI) + Merriweather (chat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LT Space" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Theme Color. Matches the light background ThemeContext writes back
         (#f6f4ef); the anti-FOUC script below overwrites it when dark. -->
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="msapplication-TileColor" content="#f6f4ef" />

    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!--
      Paint the right theme before the bundle runs.

      ThemeContext applies the `dark` class from a React effect, which is one
      frame too late: every cold load flashed the light theme first. This reads
      the same localStorage mirror it does (`user-preferences`, see
      src/shared/userSettings.ts) and applies the class up front.

      Kept deliberately dependency-free and wrapped in try/catch — it runs
      before anything else, so a throw here would leave a blank page. If the
      mirror is missing or corrupt, falling through to the OS preference is the
      same default ThemeContext would pick anyway.
    -->
    <script>
      (function () {
        try {
          var stored = null;
          var mirror = localStorage.getItem('user-preferences');
          if (mirror) {
            var parsed = JSON.parse(mirror);
            if (parsed && typeof parsed.theme === 'string') stored = parsed.theme;
          }
          var isDark = stored === 'dark'
            || ((stored === 'system' || !stored)
              && window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#141414');
          }
        } catch (error) {
          /* No stored theme worth trusting; React will settle it on mount. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!--
      Service worker registration, and the escape hatch for when it goes wrong.

      A stale worker is not hypothetical here: an installed iOS web app keeps
      its own storage, never navigates to the network on its own, and can go on
      serving a cached index.html that asks for a bundle a later build already
      deleted. The import 404s, React never mounts, and the result is a blank
      screen with nothing on it to act on — which is exactly what happened on
      the phone while the same URL worked everywhere else.

      Two guards, in order:
        1. `updateViaCache: 'none'` plus an explicit `update()` on every load,
           so sw.js itself is never served from the HTTP cache and a new worker
           is picked up instead of the old one perpetuating itself.
        2. A watchdog. If #root is still empty after the grace period, drop
           every worker and cache and reload once. sessionStorage keeps that to
           a single attempt, and a second failure says so in plain text with a
           link to the full cleaner instead of leaving the page blank.
    -->
    <script>
      (function () {
        var FLAG = 'sw-blank-recovery';
        var GRACE_MS = 12000;

        function mounted() {
          var root = document.getElementById('root');
          return !!root && root.childElementCount > 0;
        }

        function wipeAndReload() {
          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (names) {
              return Promise.all(names.map(function (name) { return caches.delete(name); }));
            }).catch(function () {}));
          }
          // Reload either way: a cleanup that failed still leaves a reload as
          // the best available move, and hanging here would keep the blank page.
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        }

        function showFallback() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family:system-ui,-apple-system,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1.5rem;line-height:1.6">' +
            '<h1 style="font-size:1.25rem;margin:0 0 .5rem">La app no cargó</h1>' +
            '<p style="margin:0 0 1rem;opacity:.75">Ya se limpió la caché una vez y sigue sin montar. El limpiador completo borra service workers y caches de este origen.</p>' +
            '<p><a href="/clear-cache.html" style="color:#2563eb">Abrir el limpiador de caché</a></p>' +
            '</div>';
        }

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
              .then(function (registration) { registration.update(); })
              .catch(function (registrationError) {
                console.log('SW registration failed: ', registrationError);
              });
          });
        }

        window.addEventListener('load', function () {
          setTimeout(function () {
            if (mounted()) {
              try { sessionStorage.removeItem(FLAG); } catch (error) { /* private mode */ }
              return;
            }
            var tried = null;
            try { tried = sessionStorage.getItem(FLAG); } catch (error) { /* private mode */ }
            if (tried) { showFallback(); return; }
            try { sessionStorage.setItem(FLAG, String(Date.now())); } catch (error) { /* private mode */ }
            wipeAndReload();
          }, GRACE_MS);
        });
      })();
    </script>
  </body>
</html>
